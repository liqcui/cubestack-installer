apiVersion: v1
kind: Pod
metadata:
  name: b2c-blocker-0
  namespace: hami-demo
  labels:
    exp: b2c
    role: blocker
  annotations:
    metax-tech.com/sgpu-topology-aware: "true"
    hami.io/node-scheduler-policy: "spread"
spec:
  nodeSelector:
    kubernetes.io/hostname: cubestack-k8s-worker02
  containers:
    - name: c
      image: registry.cubestack.io:5000/metax/maca:3.8.1.2-ubuntu22.04-amd64
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
      resources:
        limits:
          metax-tech.com/sgpu: 1
          metax-tech.com/vcore: 100
          metax-tech.com/vmemory: 4
---
