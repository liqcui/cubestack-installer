apiVersion: v1
kind: Pod
metadata:
  name: b2c-2x-0
  namespace: hami-demo
  labels:
    exp: b2c
    group: 2x
  annotations:
    hami.io/node-scheduler-policy: "binpack"
spec:
  nodeSelector:
    kubernetes.io/hostname: cubestack-k8s-worker02
  restartPolicy: Never
  containers:
    - name: c
      image: registry.cubestack.io:5000/suanova/maca-pytorch:3.8.5.2-py312-torch2.8-v2.1-SNAPSHOT-20261121-78a83fb
      imagePullPolicy: IfNotPresent
      command: ["/opt/conda/bin/python3.12", "/w/bench.py", "--n", "2048", "--seconds", "60"]
      volumeMounts:
        - name: bench
          mountPath: /w
      resources:
        limits:
          metax-tech.com/sgpu: 1
          metax-tech.com/vcore: 25
          metax-tech.com/vmemory: 8
  volumes:
    - name: bench
      configMap:
        name: b2c-bench
---
