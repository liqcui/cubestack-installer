# Volcano Job 示例: 2 个 Pod 各消费 1 个 MetaX sGPU 切片(25% 算力 / 8GiB)
# 关键: Job spec.schedulerName 与 tasks[].template.spec.schedulerName 都设为 hami-scheduler,
#       GPU 分配由 HAMi 完成; Volcano 只负责 Job/Queue 生命周期。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-sgpu-demo
  namespace: hami-demo
spec:
  minAvailable: 2
  schedulerName: hami-scheduler
  queue: default
  tasks:
    - name: sgpu
      replicas: 2
      template:
        metadata:
          annotations:
            metax-tech.com/sgpu-topology-aware: "true"
            hami.io/node-scheduler-policy: "spread"
        spec:
          schedulerName: hami-scheduler
          restartPolicy: Never
          containers:
            - name: main
              image: registry.cubestack.io:5000/metax/maca:3.8.1.2-ubuntu22.04-amd64
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 3600"]
              resources:
                limits:
                  metax-tech.com/sgpu: 1
                  metax-tech.com/vcore: 25
                  metax-tech.com/vmemory: 8
