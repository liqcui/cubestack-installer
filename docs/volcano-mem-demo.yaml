# Volcano Job 真实消费 demo: 1 个 task, 申请 25% 算力 / 8GiB 显存,
# torch 实际分配 2GiB 并持续计算; Pod 由 hami-scheduler 调度。
# 用法:
#   kubectl create ns hami-demo 2>/dev/null || true
#   kubectl apply -f docs/volcano-mem-demo.yaml
#   kubectl -n hami-demo get vcjob volcano-mem-demo
#
# 镜像需含 python3 + torch + MACA(此处使用版本树 dev-lab 的 maca-pytorch);
# 节点首次拉取约 9.3GB, 可固定到已缓存镜像的节点(去掉下面 nodeSelector 注释并按需填写)。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: volcano-mem-demo
  namespace: hami-demo
spec:
  minAvailable: 1
  schedulerName: hami-scheduler
  queue: default
  tasks:
    - name: mem
      replicas: 1
      template:
        metadata:
          annotations:
            hami.io/node-scheduler-policy: "binpack"
        spec:
          schedulerName: hami-scheduler
          # nodeSelector:
          #   kubernetes.io/hostname: <gpu-node-with-cached-image>
          restartPolicy: Never
          containers:
            - name: main
              image: registry.cubestack.io:5000/suanova/maca-pytorch:3.8.5.2-py312-torch2.8-v2.1-SNAPSHOT-20261121-78a83fb
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
                - |
                  import torch, time
                  assert torch.cuda.is_available(), "cuda not available"
                  a = torch.empty(2 * 1024**3 // 4, dtype=torch.float32, device="cuda")
                  a.fill_(1.0)
                  print("allocated_bytes", a.numel() * 4, flush=True)
                  x = torch.randn(2048, 2048, device="cuda")
                  t = time.time()
                  while time.time() - t < 600:
                      y = x @ x
                      torch.cuda.synchronize()
              resources:
                limits:
                  metax-tech.com/sgpu: 1
                  metax-tech.com/vcore: 25
                  metax-tech.com/vmemory: 8
